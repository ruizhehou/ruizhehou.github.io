  <h1>ACM 学习篇 06：哈希表与计数</h1>
  <p>哈希表是一种非常重要的数据结构，用于快速查找和计数。</p>
  <h2>核心概念</h2>
  <p>哈希表通过哈希函数将键映射到数组索引，实现 O(1) 的平均查找时间。</p>
  <h2>C++ STL 中的哈希容器</h2>
  <ul>
    <li>unordered_map: 键值对哈希表</li>
    <li>unordered_set: 哈希集合</li>
  </ul>
  <h2>基本操作示例</h2>
  <pre><code>unordered_map<int, int> cnt

cnt[5]++
  // 计数</code></pre>
